[package]
name = "urwhere"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "A tiny, fast macOS default browser that routes URLs to different Chrome profiles using regex rules."

[[bin]]
name = "urwhere"
path = "src/main.rs"

[dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSArray",
    "NSDate",
    "NSError",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "objc2-core-services",
] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    "block2",
] }
objc2-core-services = { version = "0.3.2", features = ["AE", "AEDataModel", "objc2"] }
block2 = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimise hard: this binary sits on the hot path for every link you click.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
